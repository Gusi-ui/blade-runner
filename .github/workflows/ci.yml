name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El nombre de este job es el status check obligatorio en la protección de main.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint:check

      - name: Format
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Type-check y build (frontend)
        run: pnpm build

      # Pruebas en navegador (API simulada): detectan vistas rotas, botones que no
      # responden o una página sin estilos antes de que llegue a producción.
      - name: Instalar Chromium para Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas e2e (Playwright)
        run: pnpm test:e2e

      - name: Subir informe de Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Type-check Worker
        working-directory: workers
        run: pnpm exec tsc --noEmit

      - name: Dry-run del Worker (producción y staging)
        working-directory: workers
        run: |
          pnpm exec wrangler deploy --dry-run --env=""
          pnpm exec wrangler deploy --dry-run --env staging
