name: Deploy (web + API en Cloudflare Workers)

# develop → staging (https://dev.gusi.dev) · main → producción (https://gusi.dev)
# Compila la web, despliega el Worker (que la sirve junto a la API) y pasa las
# pruebas e2e contra la URL desplegada.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      SITE_URL: ${{ github.ref_name == 'main' && 'https://gusi.dev' || 'https://dev.gusi.dev' }}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://gusi.dev' || 'https://dev.gusi.dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verificar secretos de Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta CLOUDFLARE_API_TOKEN en GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Falta CLOUDFLARE_ACCOUNT_ID en GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi
          if echo "$CLOUDFLARE_API_TOKEN" | grep -qE '[[:space:]]'; then
            echo "::error::CLOUDFLARE_API_TOKEN tiene espacios o saltos de línea. Vuelve a crear el secreto copiando solo el token, sin comillas ni 'Bearer'."
            exit 1
          fi
          if echo "$CLOUDFLARE_API_TOKEN" | grep -qE '^Bearer '; then
            echo "::error::CLOUDFLARE_API_TOKEN no debe incluir el prefijo 'Bearer '. Solo el token."
            exit 1
          fi
          if [ "${#CLOUDFLARE_API_TOKEN}" -lt 30 ]; then
            echo "::error::CLOUDFLARE_API_TOKEN parece demasiado corto. Usa un API Token de Cloudflare, no la Global API Key."
            exit 1
          fi
          if ! echo "$CLOUDFLARE_ACCOUNT_ID" | grep -qE '^[a-f0-9]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID debe ser 32 caracteres hex (sin guiones). Obténlo con: pnpm --filter blade-runner-api exec wrangler whoami"
            exit 1
          fi

      # Web y API comparten dominio: la URL de la API es la del propio sitio.
      - name: Build de la web
        run: pnpm build
        env:
          PUBLIC_API_BASE_URL: ${{ env.SITE_URL }}

      - name: Deploy Worker (${{ env.TARGET_ENV }})
        working-directory: workers
        # Producción es el entorno raíz de wrangler (--env=""); staging, --env staging.
        run: |
          if [ "$TARGET_ENV" = "production" ]; then
            pnpm exec wrangler deploy --env=""
          else
            pnpm exec wrangler deploy --env staging
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Instalar Chromium para Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas e2e contra ${{ env.SITE_URL }}
        run: pnpm test:e2e:live
        env:
          E2E_BASE_URL: ${{ env.SITE_URL }}

      - name: Subir informe de Playwright
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ env.TARGET_ENV }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
