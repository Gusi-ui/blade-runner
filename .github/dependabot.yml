version: 2
updates:
  - package-ecosystem: npm
    # Las actualizaciones entran por develop y pasan a producción con la release.
    target-branch: develop
    directories:
      - /
      - /workers
    schedule:
      interval: weekly
    # Espera unos días antes de proponer versiones recién publicadas (mitiga paquetes comprometidos).
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint y @astrojs/check aún no soportan TypeScript 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      cloudflare:
        patterns:
          - 'wrangler'
          - '@cloudflare/*'
      dev-tools:
        patterns:
          - 'prettier*'
          - 'vitest'
          - 'husky'
          - 'lint-staged'

  - package-ecosystem: github-actions
    target-branch: develop
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
