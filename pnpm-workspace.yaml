packages:
  - '.'
  - 'workers'

# Solo estos paquetes pueden ejecutar scripts de instalación (binarios nativos).
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

# Parches de seguridad en dependencias transitivas fijadas por terceros.
overrides:
  yaml-language-server>yaml: ^2.8.3
  # GHSA devalue < 5.9.1 (DoS), llega vía astro.
  devalue: ^5.9.2
